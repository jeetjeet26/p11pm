name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: install
        name: Install locked dependencies
        run: npm ci

      - id: cli
        name: Verify pinned CLIs
        if: always() && steps.install.outcome == 'success'
        run: |
          npx --no-install supabase --version
          npx --no-install vercel --version

      - id: audit
        name: Audit production dependencies
        if: always() && steps.install.outcome == 'success'
        run: npm audit --omit=dev

      - id: lint
        name: Lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - id: typecheck
        name: Typecheck
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck

      - id: unit
        name: Unit tests
        if: always() && steps.install.outcome == 'success'
        run: npm run test:unit

      - id: build
        name: Production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build

      - id: budgets
        name: Route bundle budgets
        if: always() && steps.build.outcome == 'success'
        run: npm run check:route-budgets

      - id: evidence
        name: Generate CI evidence
        if: always() && steps.install.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUDGET_OUTCOME: ${{ steps.budgets.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          status() {
            case "$1" in
              success) echo pass ;;
              skipped) echo not-run ;;
              *) echo fail ;;
            esac
          }
          npm run evidence:release -- \
            --environment ci \
            --output release-evidence.json \
            --require-clean \
            --check "pinned-clis=$(status "$CLI_OUTCOME")" \
            --check "production-audit=$(status "$AUDIT_OUTCOME")" \
            --check "lint=$(status "$LINT_OUTCOME")" \
            --check "typecheck=$(status "$TYPECHECK_OUTCOME")" \
            --check "unit=$(status "$UNIT_OUTCOME")" \
            --check "build=$(status "$BUILD_OUTCOME")" \
            --check "route-budgets=$(status "$BUDGET_OUTCOME")"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            release-evidence.json
            performance/contract.json
            performance/artifacts/route-budgets.json
            performance/schemas/v1/release-evidence.schema.json
